name: DIRECTIVE-X Production Cross-Platform Build & Verification

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C opt-level=3 -C target-cpu=native"

jobs:
  native-cross-compile:
    name: Cross-Compile & Verify Target
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: directive-x-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: directive-x-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: directive-x-macos-arm64

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Resolve and Lock Rand Dependency Version
        shell: bash
        run: |
          cargo update -p rand@0.9.5 --precise 0.8.7 || true
          cargo update -p rand_distr --precise 0.4.3 || true

      - name: Execute Full Suite (Unit, Fuzzing & High-Precision Performance)
        run: cargo test --release --all-targets

      - name: Production Binary Build (Maximum Optimization)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/directive-x
            target/${{ matrix.target }}/release/directive-x.exe
