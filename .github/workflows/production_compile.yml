name: DIRECTIVE-X Production Cross-Platform Build & Verification

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C opt-level=3"

jobs:
  native-cross-compile:
    name: Cross-Compile & Verify Target
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: directive-x-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: directive-x-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: directive-x-macos-arm64

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Generate Clean Dependency Tree
        run: cargo generate-lockfile

      - name: Execute Full Suite (Unit, Fuzzing & High-Precision Performance)
        run: cargo test --release --bin directive_x

      - name: Production Binary Build (Maximum Optimization)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ingest Data Context & Train AI Model In-Memory
        run: cargo run --release --target ${{ matrix.target }} -- --train

      - name: Install Python & GGUF Conversion Tooling (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build GGUF Sovereign Weights (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install gguf safetensors numpy torch --no-cache-dir
          
          python -c "
          import os
          import gguf
          from safetensors.torch import load_file

          print('[+] Sovereign GGUF Metadata & Tokenizer Engine starting...')
          weights = load_file('model_weights.safetensors')
          writer = gguf.GGUFWriter('directive_x.gguf', 'llama')

          # 1. إدراج المعلمات القياسية التي تطلبها محركات الهواتف (PocketPal / llama.cpp)
          writer.add_architecture()
          writer.add_name('directive_x')
          writer.add_context_length(2048)
          writer.add_embedding_length(512)
          writer.add_block_count(1)
          writer.add_feed_forward_length(2048)
          writer.add_head_count(8)
          writer.add_head_count_kv(8)
          writer.add_layer_norm_eps(1e-5)
          writer.add_file_type(gguf.GGMLFileType.MOSTLY_F16)

          # 2. بناء وتأمين الـ Tokenizer مدمج ذاتياً بدون ملفات خارجية
          tokens = ['<unk>', '<s>', '</s>']
          writer.add_tokenizer_model('llama')
          writer.add_token_list(tokens)
          writer.add_token_scores([0.0] * len(tokens))
          writer.add_token_types([1, 2, 3])
          writer.add_bos_token_id(1)
          writer.add_eos_token_id(2)

          # 3. كتابة مصفوفات الأوزان بتحويل f16
          for name, tensor in weights.items():
              arr = tensor.detach().cpu().numpy().astype('float16')
              writer.add_tensor(name, arr)

          writer.write_header_to_file()
          writer.write_kv_data_to_file()
          writer.write_tensors_to_file()
          writer.close()
          print('[✓] GGUF file generated with valid Metadata & Tokenizer successfully.')
          "

      - name: Upload Sovereign GGUF Artifact for Mobile (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: directive-x-android-ios-gguf
          path: directive_x.gguf

      - name: Upload Compiled Binary & Trained Weights Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-trained
          path: |
            target/${{ matrix.target }}/release/directive-x*
            model_weights.safetensors
