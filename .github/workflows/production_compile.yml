name: DIRECTIVE-X Production Cross-Platform Build & Verification

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C opt-level=3"

jobs:
  native-cross-compile:
    name: Cross-Compile & Verify Target
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: directive-x-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: directive-x-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: directive-x-macos-arm64

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Generate Clean Dependency Tree
        run: |
          cargo generate-lockfile

            - name: Execute Full Suite (Unit, Fuzzing & High-Precision Performance)
        run: cargo test --release --bin directive_x

      - name: Production Binary Build (Maximum Optimization)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ingest Data Context & Train AI Model In-Memory
        run: cargo run --release --target ${{ matrix.target }} -- --train

      # --- [توجيه الجهد الصافي: تحويل وتجهيز ملف الـ GGUF للهاتف بـ "صفر اعتمادات خارجية"] ---
      - name: Install Python & GGUF Conversion Tooling (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build GGUF Sovereign Weights (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install gguf safetensors numpy torch --no-cache-dir
          
          # كتابة سكربت تحويل فوري ومستقل محلياً عبر البايثون دون استخدام curl نهائياً
          python -c "
          import os
          from gguf import GGUFWriter
          from safetensors.torch import load_file
          
          print('[+] Local Sovereign conversion engine started...')
          weights = load_file('model_weights.safetensors')
          writer = GGUFWriter('directive_x.gguf', 'directive_x')
          
          for name, tensor in weights.items():
              # تحويل البيانات إلى دقة نصف عائمة f16 المتوافقة مع معالجات الهواتف
              arr = tensor.detach().cpu().numpy().astype('float16')
              writer.add_tensor(name, arr)
              
          writer.write_header_to_file()
          writer.write_kv_data_to_file()
          writer.write_tensors_to_file()
          writer.close()
          print('[✓] GGUF conversion successful and محصن.')
          "

      - name: Upload Sovereign GGUF Artifact for Mobile (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: directive-x-android-ios-gguf
          path: directive_x.gguf

      # --- [رفع الملفات والـ Binaries الأصلية كالمعتاد] ---
      - name: Upload Compiled Binary & Trained Weights Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-trained
          path: |
            target/${{ matrix.target }}/release/directive-x*
            model_weights.safetensors
