name: DIRECTIVE-X Production Cross-Platform Build & Verification

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C opt-level=3"

jobs:
  native-cross-compile:
    name: Cross-Compile & Verify Target
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: directive-x-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: directive-x-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: directive-x-macos-arm64

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Generate Clean Dependency Tree
        run: cargo generate-lockfile

      - name: Execute Full Suite (Unit, Fuzzing & High-Precision Performance)
        run: cargo test --release --bin directive_x

      - name: Production Binary Build (Maximum Optimization)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Ingest Data Context & Train AI Model In-Memory
        run: cargo run --release --target ${{ matrix.target }} -- --train

      - name: Install Python & GGUF Builder (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Atomic Chat Compatible GGUF (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install safetensors numpy gguf --no-cache-dir
          
          python -c "
          import gguf
          import numpy as np
          from safetensors.numpy import load_file

          # قراءة مصفوفات الأوزان الحقيقية الشاملة لجميع الطبقات
          weights = load_file('model_weights.safetensors')

          writer = gguf.GGUFWriter('directive_x.gguf', 'llama')

          # قراءة الأبعاد الفعلية من مصفوفة التضمين المدربة في Rust
          vocab_size = weights['token_embd.weight'].shape[0]
          hidden_size = weights['token_embd.weight'].shape[1]

          # إضافة ترويسات المعمارية الصريحة المطلوبة لمشغلات llama.cpp / PocketPal
          writer.add_architecture()
          writer.add_vocab_size(vocab_size)
          writer.add_context_length(2048)
          writer.add_embedding_length(hidden_size)
          writer.add_block_count(1)
          writer.add_feed_forward_length(256)
          writer.add_head_count(8)
          writer.add_head_count_kv(8)
          writer.add_layer_norm_rms_eps(1e-5)
          writer.add_file_type(gguf.GGMLQuantizationType.F16)

          # كتابة مفردات التوكنز القياسية الشاملة
          tokens = [f'<token_{i}>'.encode('utf-8') for i in range(vocab_size)]
          scores = [0.0] * vocab_size
          toktypes = [1] * vocab_size

          writer.add_tokenizer_model('llama')
          writer.add_token_list(tokens)
          writer.add_token_scores(scores)
          writer.add_token_types(toktypes)
          writer.add_bos_token_id(1)
          writer.add_eos_token_id(2)

          # خريطة المطابقة المحدثة بالأسماء المعيارية لـ llama.cpp
          tensor_map = {
              'token_embd.weight': 'tok_embeddings.weight',
              'fc1.weight': 'blk.0.ffn_gate.weight',
              'fc1.bias': 'blk.0.ffn_gate.bias',
              'fc2.weight': 'blk.0.ffn_down.weight',
              'fc2.bias': 'blk.0.ffn_down.bias',
              'output.weight': 'output.weight',
              'output.bias': 'output.bias',
          }

          for src_name, array in weights.items():
              dest_name = tensor_map.get(src_name, src_name)
              writer.add_tensor(dest_name, array.astype(np.float16))

          writer.write_header_to_file()
          writer.write_kv_data_to_file()
          writer.write_tensors_to_file()
          writer.close()
          print('directive_x.gguf built successfully with real trained weights!')
          "

      - name: Upload Sovereign GGUF Artifact for Mobile (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: directive-x-android-ios-gguf
          path: directive_x.gguf

      - name: Upload Compiled Binary & Trained Weights Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-trained
          path: |
            target/${{ matrix.target }}/release/directive-x*
            model_weights.safetensors
